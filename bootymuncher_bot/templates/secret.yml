apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
type: Opaque
stringData:
  APP_ID: {{ .Values.secrets.APP_ID | quote }}
  DISCORD_TOKEN: {{ .Values.secrets.DISCORD_TOKEN | quote }}
  PUBLIC_KEY: {{ .Values.secrets.PUBLIC_KEY | quote }}
  GUILD_ID: {{ .Values.secrets.GUILD_ID | quote }}
  MC_HOSTNAME: {{ .Values.secrets.MC_HOSTNAME | quote }}
  POSTGRES_HOST: {{ .Values.secrets.POSTGRES_HOST | default "bootymuncher-bot-postgres" | quote }}
  POSTGRES_PORT: {{ .Values.secrets.POSTGRES_PORT | default "5432" | quote }}
  POSTGRES_USER: {{ .Values.secrets.POSTGRES_USER | default "bot" | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.POSTGRES_PASSWORD | quote }}
  POSTGRES_DB: {{ .Values.secrets.POSTGRES_DB | default "bootymuncherbot" | quote }}
