service:
  type: ClusterIP
ingress:
  enabled: false
ollama:
  enabled: false
ollamaUrls: ["http://ollama-tailnet:11434"]
persistence:
  enabled: false
pipelines:
  enabled: false
extraEnvVars:
  - name: ENABLE_WEB_SEARCH
    value: "true"
  - name: WEB_SEARCH_ENGINE
    value: "searxng"
  - name: SEARXNG_QUERY_URL
    value: "http://searxng.open-webui.svc.cluster.local:8080/search?q=<query>"
  - name: WEB_SEARCH_RESULT_COUNT
    value: "3"
